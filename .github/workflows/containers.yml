name: Build and Push Containers

on:
  push:
    branches: [main]
    paths:
      - 'ingestion/**'
      - 'cognition/**'
      - 'transformations_dbt/**'
      - '.github/workflows/containers.yml'
  workflow_dispatch:
    inputs:
      container:
        description: 'Container to build'
        required: true
        default: 'all'
        type: choice
        options:
          - ingestion
          - cognition
          - dbt
          - all

env:
  AWS_REGION: eu-north-1

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      ingestion: ${{ steps.changes.outputs.ingestion }}
      cognition: ${{ steps.changes.outputs.cognition }}
      dbt: ${{ steps.changes.outputs.dbt }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changes
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.container }}" in
              all)
                echo "ingestion=true" >> $GITHUB_OUTPUT
                echo "cognition=true" >> $GITHUB_OUTPUT
                echo "dbt=true" >> $GITHUB_OUTPUT
                ;;
              ingestion)
                echo "ingestion=true" >> $GITHUB_OUTPUT
                echo "cognition=false" >> $GITHUB_OUTPUT
                echo "dbt=false" >> $GITHUB_OUTPUT
                ;;
              cognition)
                echo "ingestion=false" >> $GITHUB_OUTPUT
                echo "cognition=true" >> $GITHUB_OUTPUT
                echo "dbt=false" >> $GITHUB_OUTPUT
                ;;
              dbt)
                echo "ingestion=false" >> $GITHUB_OUTPUT
                echo "cognition=false" >> $GITHUB_OUTPUT
                echo "dbt=true" >> $GITHUB_OUTPUT
                ;;
            esac
          else
            git fetch origin ${{ github.event.before }} --depth=1 2>/dev/null || true

            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || git diff --name-only HEAD~1 HEAD)

            if echo "$CHANGED_FILES" | grep -q "^ingestion/"; then
              echo "ingestion=true" >> $GITHUB_OUTPUT
            else
              echo "ingestion=false" >> $GITHUB_OUTPUT
            fi

            if echo "$CHANGED_FILES" | grep -q "^cognition/"; then
              echo "cognition=true" >> $GITHUB_OUTPUT
            else
              echo "cognition=false" >> $GITHUB_OUTPUT
            fi

            if echo "$CHANGED_FILES" | grep -q "^transformations_dbt/"; then
              echo "dbt=true" >> $GITHUB_OUTPUT
            else
              echo "dbt=false" >> $GITHUB_OUTPUT
            fi
          fi

  build-ingestion:
    needs: detect-changes
    if: needs.detect-changes.outputs.ingestion == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ingestion
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ingestion/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/politikerkollen/ingestion:latest
            ${{ steps.login-ecr.outputs.registry }}/politikerkollen/ingestion:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  build-cognition:
    needs: detect-changes
    if: needs.detect-changes.outputs.cognition == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push cognition
        uses: docker/build-push-action@v5
        with:
          context: .
          file: cognition/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/politikerkollen/cognition:latest
            ${{ steps.login-ecr.outputs.registry }}/politikerkollen/cognition:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  build-dbt:
    needs: detect-changes
    if: needs.detect-changes.outputs.dbt == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push dbt
        uses: docker/build-push-action@v5
        with:
          context: .
          file: transformations_dbt/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/politikerkollen/dbt:latest
            ${{ steps.login-ecr.outputs.registry }}/politikerkollen/dbt:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
