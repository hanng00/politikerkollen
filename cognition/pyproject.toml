[project]
name = "cognition"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "openai-agents>=0.0.7",
    "openai>=1.0.0",
    "duckdb>=1.0.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "dotenv>=0.9.9",
    "langfuse>=2.0.0",
    "openinference-instrumentation-openai-agents>=0.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pyarrow>=23.0.1",
]

[project.scripts]
cognition = "cognition.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
