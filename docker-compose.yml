services:
  # Dagster orchestration image
  dagster:
    build:
      context: .
      dockerfile: orchestration_dagster/Dockerfile
    image: politikerkollen/dagster:latest
    networks:
      - politikerkollen-network

  # Ingestion (dlt) image
  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    image: politikerkollen/ingestion:latest
    networks:
      - politikerkollen-network

  # Cognition (LLM processing) image
  cognition:
    build:
      context: .
      dockerfile: cognition/Dockerfile
    image: politikerkollen/cognition:latest
    networks:
      - politikerkollen-network

  # Transformations (dbt) image
  transformations_dbt:
    build:
      context: .
      dockerfile: transformations_dbt/Dockerfile
    image: politikerkollen/transformations_dbt:latest
    networks:
      - politikerkollen-network

networks:
  politikerkollen-network:
    driver: bridge
    name: politikerkollen-network
