services:
  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    image: spatial/ingestion:latest
    networks:
      - spatial-network

  transformations_dbt:
    build:
      context: .
      dockerfile: transformations_dbt/Dockerfile
    image: spatial/transformations_dbt:latest
    networks:
      - spatial-network

networks:
  spatial-network:
    driver: bridge
    name: spatial-network
