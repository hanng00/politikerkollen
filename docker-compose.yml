services:
  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    image: spatial/ingestion:latest
    networks:
      - politikerkollen-network

  transformations_dbt:
    build:
      context: .
      dockerfile: transformations_dbt/Dockerfile
    image: spatial/transformations_dbt:latest
    networks:
      - politikerkollen-network

networks:
  politikerkollen-network:
    driver: bridge
    name: politikerkollen-network
