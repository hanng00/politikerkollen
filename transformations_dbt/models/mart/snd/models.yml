version: 2

models:
  - name: mart_promise_evidence
    description: |
      One row per (promise, source document) with evidence signals.
      This is the foundation for promise accountability assessment.
      
      Each row represents a piece of evidence about whether a party
      acted on their promise, with correct Ja/Nej inversion handling
      and proper motion-to-punkt lineage.
      
      Signal types (ordered by strength):
        - proposition_passed: Government proposition passed that aligns with promise
        - motion_bifall_supported: Motion approved, party supported it
        - motion_bifall_opposed: Motion approved, party opposed it
        - motion_supported: Party supported an aligned motion (even if rejected)
        - motion_opposed: Party opposed an aligned motion
        - motion_abstained: Party abstained on the vote
      
      The effective_stance correctly handles the Ja/Nej inversion:
        - Ja = agree with committee (NOT support motion)
        - Nej = disagree with committee (NOT oppose motion)
    columns:
      - name: match_id
        description: "Unique identifier for the promise-source match"
        tests:
          - not_null
          - unique
      - name: promise_id
        description: "FK to promise"
        tests:
          - not_null
      - name: source_dok_id
        description: "FK to source document (motion or proposition)"
        tests:
          - not_null
      - name: signal_type
        description: "Type of evidence signal"
        tests:
          - not_null
      - name: signal_weight
        description: "Numeric weight for composite scoring (-0.5 to +0.5)"
        tests:
          - not_null
      - name: effective_stance
        description: "Party's effective stance on the motion: supported_motion | opposed_motion | abstained | split | unknown"
      - name: alignment
        description: "LLM classification: supports | opposes | tangential"

  - name: mart_promise_score
    description: |
      One row per promise with aggregated evidence and composite score.
      This is the top-level view for promise accountability assessment.
      
      Aggregates all evidence from mart_promise_evidence into:
        - A composite score (-1.0 to +1.0)
        - Evidence strength (strong/moderate/weak/none)
        - Evidence direction (acted/mixed/inaction/contradiction)
        - Top evidence items for display
      
      Score interpretation:
        >= 0.5:  "Starkt stöd" (strong evidence of action)
        0.2-0.5: "Visst stöd" (some evidence of action)
        -0.2-0.2: "Oklart" (mixed or insufficient evidence)
        -0.5--0.2: "Svagt stöd" (some evidence of inaction)
        <= -0.5: "Motsägelse" (strong evidence of contradiction)
    columns:
      - name: promise_id
        description: "Primary key - unique identifier for the promise"
        tests:
          - not_null
          - unique
      - name: composite_score
        description: "Aggregated score from -1.0 (contradiction) to +1.0 (strong action)"
        tests:
          - not_null
      - name: evidence_strength
        description: "Strength of evidence: strong | moderate | weak | none"
        tests:
          - not_null
      - name: evidence_direction
        description: "Direction of evidence: acted | some_action | mixed | some_inaction | contradiction"
        tests:
          - not_null
      - name: assessment_label
        description: "Human-readable Swedish label for the assessment"
        tests:
          - not_null
      - name: top_evidence
        description: "Array of top 10 evidence items for display"
        tests:
          - not_null
