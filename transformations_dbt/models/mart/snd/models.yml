version: 2

models:
  - name: mart_promise_accountability_cards
    description: |
      Mart model grouping promises with their semantically matched source documents
      and voting outcomes.
      
      Designed for the viral "accountability card" feature showing how parties
      voted on issues related to their election promises.
      
      Output: One row per promise, with an array of related motions and their votes.
      This enables the UI to show one card per promise with multiple motions listed.
      
      Join path:
        promise → stg_promise_vote_matches → source_dok_id
        source_dok_id → int_vote_source_links → votering_id
        votering_id → stg_voteringlista → party votes
      
      Use cases:
      - Generate shareable accountability cards
      - Analyze party voting consistency with promises
      - Find contradictions between promises and votes
    columns:
      - name: promise_id
        description: "Primary key - unique identifier for the promise."
        tests:
          - not_null
          - unique

      - name: document_id
        description: "Source document ID from valmanifest."
        tests:
          - not_null

      - name: promise_party
        description: "Party that made the promise (e.g., 's', 'm', 'c')."
        tests:
          - not_null

      - name: promise_year
        description: "Election year when the promise was made."

      - name: promise_text
        description: "The promise rephrased as a clear, actionable statement."
        tests:
          - not_null

      - name: source_quote
        description: "Exact quote from the source document."
        tests:
          - not_null

      - name: category
        description: "Policy area category (skatt, vard, skola, etc.)."
        tests:
          - not_null

      - name: specificity
        description: "Promise specificity level (high, medium, low)."
        tests:
          - not_null

      - name: target_group
        description: "Target beneficiary group if mentioned."

      - name: measurable
        description: "Whether the promise can be objectively verified."
        tests:
          - not_null

      - name: motions
        description: |
          Array of related motions/propositions and their voting outcomes.
          Each element contains: match_id, similarity_score, source_dok_id,
          source_dok_typ, source_titel, source_parti, source_url, votering_id,
          bet_dok_id, punkt, punkt_rubrik, promise_party_vote, ja_count,
          nej_count, riksdag_outcome, accountability_status.
        tests:
          - not_null

      - name: motion_count
        description: "Number of related motions for this promise."
        tests:
          - not_null

      - name: best_similarity_score
        description: |
          Highest similarity score among all matched motions.
          Used for sorting/filtering in the feed.
        tests:
          - not_null

      - name: best_accountability_status
        description: |
          Accountability status of the best matching motion.
          Values: supported_passed, supported_failed, opposed_passed,
          opposed_failed, abstained, unknown.
        tests:
          - not_null

      - name: has_contradiction
        description: |
          Boolean indicating if any motion has a contradiction
          (party voted Nej on a related proposal).
        tests:
          - not_null
