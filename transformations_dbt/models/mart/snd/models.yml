version: 2

models:
  - name: mart_promise_accountability_cards
    description: |
      Mart model joining promises with their semantically matched source documents
      and voting outcomes.
      
      Designed for the viral "accountability card" feature showing how parties
      voted on issues related to their election promises.
      
      Join path:
        promise → stg_promise_vote_matches → source_dok_id
        source_dok_id → int_vote_source_links → votering_id
        votering_id → stg_voteringlista → party votes
      
      Note: One promise-source match may have multiple votes (different punkter).
      This is intentional - shows all relevant voting activity.
      
      Use cases:
      - Generate shareable accountability cards
      - Analyze party voting consistency with promises
      - Find contradictions between promises and votes
    columns:
      - name: promise_id
        description: "Foreign key to stg_valmanifest_promises.promise_id."
        tests:
          - not_null

      - name: document_id
        description: "Source document ID from valmanifest."
        tests:
          - not_null

      - name: promise_party
        description: "Party that made the promise (e.g., 's', 'm', 'c')."
        tests:
          - not_null

      - name: promise_year
        description: "Election year when the promise was made."

      - name: promise_text
        description: "The promise rephrased as a clear, actionable statement."
        tests:
          - not_null

      - name: source_quote
        description: "Exact quote from the source document."
        tests:
          - not_null

      - name: category
        description: "Policy area category (skatt, vard, skola, etc.)."
        tests:
          - not_null

      - name: specificity
        description: "Promise specificity level (high, medium, low)."
        tests:
          - not_null

      - name: target_group
        description: "Target beneficiary group if mentioned."

      - name: measurable
        description: "Whether the promise can be objectively verified."
        tests:
          - not_null

      - name: match_id
        description: "Unique identifier for this promise-source match."
        tests:
          - not_null

      - name: similarity_score
        description: |
          Cosine similarity between promise and source embeddings.
          Higher scores indicate stronger semantic match.
        tests:
          - not_null

      - name: source_dok_id
        description: "Document ID of the matched source (motion or proposition)."
        tests:
          - not_null

      - name: source_dok_typ
        description: "Type of source document: 'mot' (motion) or 'prop' (proposition)."
        tests:
          - not_null

      - name: source_titel
        description: "Title of the source document."
        tests:
          - not_null

      - name: source_parti
        description: "Party that authored the source (for motions) or 'Regeringen' (for props)."

      - name: source_url
        description: "URL to the source document on riksdagen.se."

      - name: votering_id
        description: "Riksdagen vote identifier."

      - name: bet_dok_id
        description: "Betänkande document ID containing the vote."

      - name: punkt
        description: "Vote punkt number within the betänkande."

      - name: punkt_rubrik
        description: "Title/description of the vote punkt."

      - name: source_outcome
        description: |
          Outcome for this specific source in this vote.
          Values: approved, rejected, acklamation, unknown.

      - name: promise_party_vote
        description: |
          How the promising party voted (Ja, Nej, Avstår).
          Based on party majority vote.

      - name: promise_party_vote_count
        description: "Number of party members who voted this way."

      - name: ja_count
        description: "Total 'Ja' votes across all parties."

      - name: nej_count
        description: "Total 'Nej' votes across all parties."

      - name: avstar_count
        description: "Total 'Avstår' votes across all parties."

      - name: riksdag_outcome
        description: |
          Overall vote outcome.
          - Bifall: Proposal passed (more Ja than Nej)
          - Avslag: Proposal rejected (more Nej than Ja)

      - name: accountability_status
        description: |
          Indicator of how the party's vote relates to the outcome.
          Values:
          - supported_passed: Party voted Ja, proposal passed
          - supported_failed: Party voted Ja, proposal failed
          - opposed_passed: Party voted Nej, proposal passed
          - opposed_failed: Party voted Nej, proposal failed
          - abstained: Party abstained
          - unknown: Vote data unavailable
