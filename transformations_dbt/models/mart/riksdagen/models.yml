version: 2

models:
  - name: mart_person
    description: |
      One row per politician with aggregated stats from their timeline.
      Designed for the /politicians API endpoint.

      Query patterns:
        - List all: SELECT * FROM mart_person ORDER BY namn
        - Search: SELECT * FROM mart_person WHERE jaro_winkler_similarity('query', namn) > 0.8
        - By party: SELECT * FROM mart_person WHERE parti = 'S'

    columns:
      - name: intressent_id
        description: "Riksdagen person identifier (primary key)"
        tests:
          - not_null
          - unique

      - name: namn
        description: "Full name (tilltalsnamn + efternamn)"

      - name: parti
        description: "Political party abbreviation (S, M, SD, C, V, KD, L, MP)"

      - name: valkrets
        description: "Electoral constituency"

      - name: status
        description: "Current status (Tjänstgörande riksdagsledamot, etc.)"

      - name: total_votes
        description: "Total number of votes cast"

      - name: total_speeches
        description: "Total number of speeches given"

      - name: total_authored
        description: "Total number of documents authored/signed"

  - name: mart_person_timeline
    description: |
      One row per action per person, pre-joined with all context needed for analysis.
      Designed for contradiction detection: "What did person X say vs do?"

      Action types:
        - vote: Cast a vote (Ja/Nej/Avstår) on a betänkande punkt
        - speech: Gave a speech in the chamber
        - authored: Signed/authored a document (motion, skriftlig fråga, etc.)

      Query pattern: 
        SELECT * FROM mart_person_timeline 
        WHERE intressent_id = 'X' 
        ORDER BY action_date

    columns:
      - name: intressent_id
        description: "Riksdagen person identifier"
        tests:
          - not_null

      - name: namn
        description: "Full name (tilltalsnamn + efternamn)"

      - name: parti
        description: "Political party abbreviation"

      - name: action_type
        description: "Type of action: vote, speech, authored"
        tests:
          - not_null
          - accepted_values:
              values: ["vote", "speech", "authored"]

      - name: action_date
        description: "Date of the action"
        tests:
          - not_null

      - name: action_id
        description: "Unique identifier for the action (votering_id, systemnyckel, or dok_id)"

      - name: vote_value
        description: "Vote choice: Ja, Nej, Avstår (only for action_type=vote)"

      - name: subject_title
        description: "Title/heading of what the action was about"

      - name: subject_text
        description: "Full text of the proposal being voted on (only for votes)"

      - name: speech_text_clean
        description: "Full speech text, HTML stripped (only for action_type=speech)"

      - name: authored_dok_typ
        description: "Document type: Motion, Skriftlig fråga, etc. (only for action_type=authored)"

      - name: authored_roll
        description: "Role: undertecknare, fragestallare, etc. (only for action_type=authored)"

      - name: authored_stakeholders
        description: |
          JSON array of all stakeholders for this document (only for action_type=authored).
          Structure: [{ intressent_id, namn, parti, roll, ordning }, ...]
          Roles: undertecknare (author), stalldtill (addressed to), besvaradav (answered by), fragestallare (questioner)

  - name: mart_motion_impact_score
    description: |
      One row per motion with a composite impact score S ∈ [0, 1] and all sub-components.

      S = 0.35·O + 0.20·M + 0.20·C + 0.15·N + 0.10·T

      Components:
        O  outcome_score      bifall=1.0, avslag/acklamation=0.3
        M  vote_margin_score  1 − |Ja−Nej|/(Ja+Nej), null for acklamation
        C  cross_party_score  distinct signatory parties / 8
        N  signatory_score    min(signatories / 50, 1.0)
        T  topic_score        static weight by utskott (organ)

      Motioner without a betänkande outcome are included with is_provisional=true;
      their score is computed from C and N only (engagement signals).

      score_breakdown (JSON) contains all components with scores, labels, and weights
      for direct consumption by the frontend breakdown UI.

    columns:
      - name: mot_dok_id
        description: "Motion document ID (primary key)"
        tests:
          - not_null
          - unique

      - name: impact_score
        description: "Composite score S ∈ [0, 1], rounded to 4 decimal places"

      - name: is_provisional
        description: "True when no betänkande outcome exists yet"

      - name: outcome_score
        description: "O component: bifall=1.0, avslag/acklamation=0.3, null=unresolved"

      - name: outcome_label
        description: "bifall | avslag | unknown"

      - name: vote_margin_score
        description: "M component: 1.0=contested, 0.0=unanimous, null=acklamation"

      - name: cross_party_score
        description: "C component: distinct signatory parties / 8"

      - name: signatory_score
        description: "N component: min(signatories / 50, 1.0)"

      - name: topic_score
        description: "T component: static weight by organ (FiU=1.0 … unknown=0.3)"

      - name: organ
        description: "Riksdag committee that handled the motion (from parent betänkande)"

      - name: score_breakdown
        description: |
          JSON object with all five components for UI rendering.
          Structure: { outcome, vote_margin, cross_party, signatories, topic }
          Each: { score, weight, ...detail fields }

  - name: mart_politician_motion_rank
    description: |
      One row per politician with Bayesian-adjusted motion pass rate.
      
      Uses Beta-Binomial Bayesian shrinkage to fairly rank politicians by motion effectiveness.
      Raw pass rate (passed/total) is misleading for politicians with few motions.
      This model shrinks estimates toward the global mean, with shrinkage intensity
      inversely proportional to sample size.
      
      Formula:
        Prior: θ ~ Beta(α, β) where α = μk, β = (1-μ)k
        Posterior mean: E[θ] = (s + α) / (n + α + β)
        
        μ = global pass rate across all politicians
        k = 20 (prior strength in pseudo-motions)
        s = passed motions
        n = resolved motions (passed + rejected)
      
      Effect:
        - 1 motion passed out of 1: ~7% (shrunk heavily toward ~5% global mean)
        - 50 motions passed out of 100: ~48% (minimal shrinkage)
      
      Query patterns:
        - Rank by effectiveness: ORDER BY ranking_score DESC
        - Filter by confidence: WHERE confidence_tier IN ('high', 'medium')

    columns:
      - name: intressent_id
        description: "Riksdagen person identifier (primary key)"
        tests:
          - not_null
          - unique

      - name: total_motions
        description: "Total motions authored/signed"

      - name: passed_motions
        description: "Motions that received bifall"

      - name: rejected_motions
        description: "Motions that received avslag"

      - name: pending_motions
        description: "Motions without outcome yet"

      - name: resolved_motions
        description: "passed_motions + rejected_motions"

      - name: raw_pass_rate_pct
        description: "Raw pass rate as percentage (passed/resolved * 100)"

      - name: bayesian_pass_rate_pct
        description: "Bayesian posterior mean as percentage"

      - name: credible_lower_bound_pct
        description: "95% credible interval lower bound as percentage"

      - name: global_pass_rate_pct
        description: "Global average pass rate across all politicians"

      - name: ranking_score
        description: "Score used for ranking (= bayesian_pass_rate)"

      - name: shrinkage_pct
        description: "How much the estimate was shrunk toward the prior (0-100%)"

      - name: confidence_tier
        description: |
          Confidence level based on sample size:
            - high: 50+ resolved motions
            - medium: 20-49 resolved motions
            - low: 5-19 resolved motions
            - very_low: <5 resolved motions
