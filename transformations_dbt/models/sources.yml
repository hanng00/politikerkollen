version: 2

sources:
  - name: raw_riksdagen
    database: spatial_dagster
    # Schema matches dlt dataset_name - all raw riksdagen tables are in 'raw_riksdagen' schema
    # Database is the MotherDuck database 'spatial_dagster' configured in profiles.yml
    # Asset keys follow structure: raw/riksdagen/raw_anforandelista
    schema: raw_riksdagen
    tables:
      - name: dokumentlista
      - name: personlista
      - name: voteringlista
      - name: anforande
      - name: dokumentstatus
      - name: dokumentstatus__dokaktivitet__aktivitet
      - name: dokumentstatus__dokbilaga__bilaga
      - name: dokumentstatus__dokforslag__forslag
      - name: dokumentstatus__dokintressent__intressent
      - name: dokumentstatus__dokmotforslag__motforslag
      - name: dokumentstatus__dokreferens__referens
      - name: dokumentstatus__dokumentuppgift__uppgift
      - name: dokumentstatus__dokuppgift__uppgift
      - name: dokumentstatus__dokutskottsforslag__utskottsforslag
      - name: personlista__personuppdrag__uppdrag
      - name: personlista__personuppdrag__uppdrag__uppgift
      - name: personlista__personuppgift__uppgift
      - name: personlista__personuppgift__uppgift__uppgift

  - name: raw_snd
    database: spatial_dagster
    # SND (Swedish National Data Service) - static datasets
    # Contains party programs and election manifestos
    schema: raw_snd
    tables:
      - name: valmanifest
        description: "Swedish party programs and election manifestos from 1897 to present"

  - name: cognition
    database: spatial_dagster
    # Processed SND data - LLM-extracted and embedded data
    # Contains promises, embeddings, and matches from cognition module
    schema: cognition
    tables:
      - name: valmanifest_promises
        description: "Political promises extracted from party manifestos using LLM"
      - name: extraction_state
        description: "Tracks which documents have been processed for promise extraction"
      - name: promise_embeddings
        description: "Vector embeddings for promises using text-embedding-3-small"
      - name: vote_embeddings
        description: "Vector embeddings for vote proposals using text-embedding-3-small"
      - name: promise_vote_matches
        description: "Semantic matches between promises and votes based on cosine similarity"
