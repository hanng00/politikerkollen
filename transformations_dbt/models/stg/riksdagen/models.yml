        description: "Links to parent personlista._dlt_id"
        tests:
          - not_null
      - name: _dlt_id
        description: "DLT record identifier"
        tests:
          - not_null

  - name: stg_personlista_personuppgift_uppgift_uppgift
    description: "Staging model for nested values under uppgift (personuppgift.uppgift.uppgift). Links to parent via _dlt_parent_id."
    columns:
      - name: _dlt_parent_id
        description: "Links to parent personuppgift__uppgift._dlt_id"
        tests:
          - not_null
      - name: _dlt_id
        description: "DLT record identifier"
        tests:
          - not_null

