        description: "Speech text (VARCHAR) - truncated, use stg_anforande for full text"

  - name: stg_anforande
    description: "Staging model for anforande - full speech text from Riksdagen debates. This source provides complete anforandetext (vs truncated in anforandelista). Deduplicated on systemnyckel."
    columns:
      - name: systemnyckel
        description: "Primary key - unique speech identifier in Riksdagen's database. Format: numeric string (e.g., '538886'). Used as the main identifier to link speeches across data sources."
        tests:
          - not_null
      - name: dok_datum
        description: "Date of the protocol/debate session. Format: YYYY-MM-DD with timezone (e.g., '2022-02-01 01:00:00+01')."
      - name: dok_rm
        description: "Parliamentary session (riksmöte). Format: YYYY/YY (e.g., '2021/22')."
      - name: dok_id
        description: "Protocol document identifier. Links to the protocol document in dokumentlista. Format: e.g., 'H90962'."
      - name: dok_id_normalized
        description: "Trimmed dok_id with empty strings set to null. Use for joins."
      - name: dok_titel
        description: "Protocol document title. Format: 'Protokoll YYYY/YY:NN Weekday den D Month' (e.g., 'Protokoll 2021/22:62 Tisdagen den 1 februari')."
      - name: dok_nummer
        description: "Protocol number within the session. Format: numeric string (e.g., '62')."
      - name: dok_hangar_id
        description: "Internal Hangar system identifier for the protocol document."
      - name: anforande_id
        description: "Unique speech identifier (GUID format). Format: UUID string (e.g., 'bba859bc-3cbb-ec11-9167-901b0eac4c78')."
      - name: anforande_nummer
        description: "Speech number within the protocol. Used with dok_id to form composite key for API lookups. Format: numeric (e.g., 108)."
      - name: talare
        description: "Speaker name with title and party. Format: 'Title Firstname Lastname (Party)' (e.g., 'Statsrådet Khashayar Farmanbar (S)')."
      - name: parti
        description: "Political party abbreviation of the speaker. Values: S, M, SD, C, V, KD, L, MP, etc."
      - name: intressent_id
        description: "Foreign key to stg_personlista.intressent_id. Links the speech to the politician who delivered it."
      - name: anforandetext
        description: "Full speech text in HTML format. Contains the complete speech content with HTML paragraph tags (<p>). May include STYLEREF markers from Word conversion."
      - name: anforandetext_clean
        description: "Speech text with HTML tags stripped. Plain text version for text analysis and search."
      - name: rel_dok_id
        description: "Related document identifier - the document being debated (e.g., interpellation, motion). Format: e.g., 'H910274' for interpellation 2021/22:274."
      - name: rel_dok_id_normalized
        description: "Trimmed rel_dok_id with empty strings set to null. Use for joins to dokumentlista."
      - name: avsnittsrubrik
        description: "Section heading - the agenda item or topic being discussed. Format: e.g., 'Svar på interpellation 2021/22:274 om elförsörjningens betydelse för jobb och företagande'."
      - name: underrubrik
        description: "Subsection heading. Often empty string."
      - name: kammaraktivitet
        description: "Type of chamber activity. Values include: 'interpellationsdebatt' (interpellation debate), 'allmänpolitisk debatt', 'frågestund', etc."
      - name: replik
        description: "Reply indicator. Values: 'N' (not a reply), 'Y' (is a reply to previous speech). Used to identify debate exchanges."
      - name: systemdatum
        description: "System timestamp when the record was created/updated. Format: YYYY-MM-DD HH:MM:SS+TZ."
      - name: protokoll_url_www
        description: "URL to the speech in the protocol on riksdagen.se. Format: 'https://www.riksdagen.se/sv/dokument-och-lagar/dokument/protokoll/protokoll_H90962/#anf108'."
      - name: _dlt_load_id
        description: "DLT load identifier - unique identifier for each data ingestion run."
        tests:
          - not_null
      - name: _dlt_id
        description: "DLT record identifier - unique identifier for each row within a load."
        tests:
          - not_null

