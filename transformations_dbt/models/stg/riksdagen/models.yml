version: 2

models:
  - name: stg_personlista
    description: "Staging model for personlista - raw passthrough from Riksdagen member list API. Contains information about current and former members of the Swedish Parliament (Riksdag) from approximately 1990 onwards."
    columns:
      - name: hangar_guid
        description: "Globally unique identifier (GUID) for the person record in the Hangar system. Hangar is Riksdagen's internal content management system. Format: UUID string."
      - name: sourceid
        description: "Source system identifier - unique identifier from the original source system. Format: UUID string (e.g., d7c31b84-83e4-11d4-ae60-0050040c9b55)."
      - name: intressent_id
        description: "Primary key - unique politician identifier in Riksdagen's database. This is the official Riksdagen person-ID (Wikidata Property P1214). Format: 9-13 digit numeric string (e.g., '0897304708905'). This identifier never changes once assigned and is stable across all Riksdagen data sources. Used as the main foreign key to link politicians across documents, votes, speeches, and assignments."
        tests:
          - not_null
      - name: hangar_id
        description: "Internal Hangar system identifier for the person. Hangar is Riksdagen's content management system. This is a numeric string identifier used internally by the Hangar CMS."
      - name: fodd_ar
        description: "Birth year of the parliamentarian. Format: 4-digit year as string (e.g., '1947'). Used for age calculations and demographic analysis."
      - name: kon
        description: "Gender of the parliamentarian. Values: 'kvinna' (woman), 'man' (man). Used for gender representation analysis in Swedish politics."
      - name: efternamn
        description: "Last name (surname) of the parliamentarian. Swedish: 'efternamn'. This is the family name used for official identification."
      - name: tilltalsnamn
        description: "First name (given name) - the name the parliamentarian prefers to be called. Swedish: 'tilltalsnamn'. This may differ from their legal first name and is used in official communications and public appearances."
      - name: sorteringsnamn
        description: "Sorting name - standardized name format used for alphabetical sorting in member lists. Format: typically 'Lastname,Firstname' (e.g., 'Bohlin,Sinikka'). Used as the default sort order in Riksdagen's member directory and API responses."
      - name: iort
        description: "Birthplace (födelseort) - the city or location where the parliamentarian was born. May be empty string if not provided. Used for geographic analysis of representation."
      - name: parti
        description: "Political party name. Swedish political parties include: 'S' (Socialdemokraterna), 'M' (Moderaterna), 'SD' (Sverigedemokraterna), 'C' (Centerpartiet), 'V' (Vänsterpartiet), 'KD' (Kristdemokraterna), 'L' (Liberalerna), 'MP' (Miljöpartiet). Party affiliation can change over time for individual members."
      - name: valkrets
        description: "Electoral district (constituency) - the geographic area the parliamentarian represents. Sweden has 29 electoral districts (valkretsar) corresponding to counties (län). Examples: 'Stockholms län', 'Gävleborgs län', 'Skåne läns norra och östra valkrets'. Each district elects members proportionally based on population."
      - name: status
        description: "Current membership status in the Riksdag. Common values: 'Tjänstgörande riksdagsledamot' (serving member), 'Tidigare riksdagsledamot' (former member), 'Ledig' (on leave), 'Ersättare' (substitute). Status indicates whether the person is currently active, historical, or temporarily replaced."
      - name: person_url_xml
        description: "URL to the parliamentarian's detailed XML data page on Riksdagen's open data API. Format: 'https://data.riksdagen.se/person/[sourceid]'. Contains comprehensive information about the person's parliamentary activities, assignments, and history."
      - name: bild_url_80
        description: "URL to the parliamentarian's portrait image at 80x80 pixels resolution. Format: 'https://data.riksdagen.se/filarkiv/bilder/ledamot/[sourceid]_80.jpg'. Used for small profile thumbnails in member directories."
      - name: bild_url_192
        description: "URL to the parliamentarian's portrait image at 192x192 pixels resolution. Format: 'https://data.riksdagen.se/filarkiv/bilder/ledamot/[sourceid]_192.jpg'. Standard size for member profile pages."
      - name: bild_url_max
        description: "URL to the parliamentarian's portrait image at maximum resolution (highest quality available). Format: 'https://data.riksdagen.se/filarkiv/bilder/ledamot/[sourceid]_max.jpg'. Used for high-quality displays and print media."
      - name: personuppdrag
        description: "JSON structure containing the parliamentarian's assignments and roles (uppdrag). Structure: { 'uppdrag': [{ 'organ_kod': string (e.g., 'kam' for chamber), 'roll_kod': string (e.g., 'Riksdagsledamot'), 'ordningsnummer': string, 'status': string (e.g., 'Tjänstgörande'), 'typ': string (e.g., 'kammaruppdrag'), 'from': date, 'tom': date, 'uppgift': array, 'intressent_id': string, 'hangar_id': string, ... }] }. Contains historical and current assignments including committee memberships, leadership roles, and special assignments. Extract using json_array_length() and json_extract_string() in intermediate models."
      - name: personuppgift
        description: "JSON structure containing additional personal information about the parliamentarian. May include contact details, professional background, education, and other biographical data. Structure varies and should be parsed as needed in intermediate models using JSON extraction functions."
      - name: _dlt_load_id
        description: "DLT (data load tool) load identifier - unique identifier for each data ingestion run. Used to track when data was loaded and for incremental processing. Format: string/timestamp identifier."
      - name: _dlt_id
        description: "DLT (data load tool) record identifier - unique identifier for each row within a load. Used for deduplication and change tracking. Format: string identifier, unique per record."

  - name: stg_personlista_personuppdrag_uppdrag
    description: "Staging model for parliamentary assignments (personuppdrag). Links to parent via _dlt_parent_id."
    columns:
      - name: _dlt_parent_id
        description: "Links to parent personlista._dlt_id"
        tests:
          - not_null
      - name: _dlt_id
        description: "DLT record identifier"
        tests:
          - not_null

