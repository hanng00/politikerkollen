version: 2

models:
  - name: int_node_person
    description: "Graph node: person. node_id = person:{intressent_id}. See docs/RELATIONS.md."
    columns:
      - name: node_id
        description: "Globally unique node identifier"
        tests:
          - not_null
          - unique
      - name: intressent_id
        description: "Domain ID from Riksdagen"

  - name: int_node_dok
    description: "Graph node: document. node_id = dok:{dok_id}. node_typ: betankande, motion, proposition, etc. See docs/RELATIONS.md."
    columns:
      - name: node_id
        description: "Globally unique node identifier"
        tests:
          - not_null
          - unique
      - name: dok_id
        description: "Domain ID from Riksdagen"
      - name: node_typ
        description: "Document type from serie_kod (01=betankande, 02=motion, 03=proposition)"

  - name: int_node_event
    description: "Graph node: event (votering, anförande). node_id = event:vot_{votering_id} | event:anf_{systemnyckel}. See docs/RELATIONS.md."
    columns:
      - name: node_id
        description: "Globally unique node identifier"
        tests:
          - not_null
          - unique
      - name: votering_id
        description: "Domain ID from Riksdagen"

  - name: int_motion_outcome
    description: |
      One row per (motion, betänkande) pair.
      A motion can be treated in multiple betänkanden when it spans multiple policy areas.
      Resolves mot → bet → utskottsforslag via dlt join keys.
      Provides outcome_score (O) and votering_id for downstream margin calculation.
    columns:
      - name: mot_dok_id
        description: "Motion document ID"
        tests:
          - not_null
      - name: bet_dok_id
        description: "Parent betänkande dok_id"
        tests:
          - not_null
      - name: outcome_score
        description: "O component: bifall=1.0, avslag/acklamation=0.3"
      - name: outcome_label
        description: "Human-readable: bifall | avslag | unknown"
      - name: organ
        description: "Committee organ from parent betänkande (e.g. FiU, KU, CU)"
      - name: votering_id
        description: "Roll-call vote ID; null when beslutstyp=acklamation"
    tests:
      - unique:
          column_name: "mot_dok_id || '|' || bet_dok_id"

  - name: int_motion_vote_margin
    description: |
      One row per votering_id with aggregated Ja/Nej counts and the M (margin) component.
      M = 1 − |Ja − Nej| / (Ja + Nej). Joins to int_motion_outcome on votering_id.
    columns:
      - name: votering_id
        description: "Roll-call vote ID (primary key, lowercased)"
        tests:
          - not_null
          - unique
      - name: vote_margin_score
        description: "M component: 1.0 = 50/50 split, 0.0 = unanimous"
      - name: ja_count
        description: "Total Ja votes"
      - name: nej_count
        description: "Total Nej votes"

  - name: int_motion_signatories
    description: |
      One row per motion with signatory counts and derived N + C components.
      Source: stg_dokumentstatus_intressent where parent is a motion.
    columns:
      - name: mot_dok_id
        description: "Motion document ID (primary key)"
        tests:
          - not_null
          - unique
      - name: signatory_score
        description: "N component: min(signatory_count / 50, 1.0)"
      - name: cross_party_score
        description: "C component: distinct signatory parties / 8"
      - name: signatory_count
        description: "Total co-signers (undertecknare + huvudman)"
      - name: distinct_parties
        description: "Number of distinct parties among signatories"

  - name: int_edge
    description: |
      Graph edges: union of all relation types.
      Supports: betänkande ↔ votes, who voted, motioner/propositioner → betänkande, who wrote.
      See docs/RELATIONS.md.
    columns:
      - name: from_id
        description: "Source node_id"
        tests:
          - not_null
      - name: to_id
        description: "Target node_id"
        tests:
          - not_null
      - name: edge_typ
        description: "Relation type: undertecknare, rostade, handlar_om, refererar, relaterat, etc."
      - name: datum
        description: "Edge timestamp"
      - name: source
        description: "Staging source for lineage"
      - name: payload
        description: "Edge-specific data (e.g. rost for rostade edges: Ja/Nej/Avstår)"
