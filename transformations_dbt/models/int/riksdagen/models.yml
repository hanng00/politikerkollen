version: 2

models:
  - name: int_motion_bifall
    description: |
      Extracts explicit motion approvals from utskottsforslag decision text.
      Swedish parliament rarely approves motions via vinnare='motförslaget'.
      Instead, motions are approved through reservation wins where forslag text
      explicitly states "bifaller riksdagen motion(erna) X".
      
      This model parses the forslag text to extract specific motion dok_ids
      that were approved, enabling accurate attribution of wins to motions.
    columns:
      - name: mot_dok_id
        description: "Motion document ID that was approved"
        tests:
          - not_null
      - name: bet_dok_id
        description: "Betänkande where the motion was approved"
        tests:
          - not_null
      - name: bifall_typ
        description: "Type of approval: direkt_bifall | reservation_bifall | utskott_bifall"
      - name: is_delvis_bifall
        description: "True if motion was partially approved (delvis bifallen)"
      - name: is_tillkannagivande
        description: "True if decision includes a tillkännagivande (parliamentary directive)"
      - name: outcome_score
        description: "1.0 for full bifall, 0.7 for delvis bifall"
    tests:
      - unique:
          column_name: "mot_dok_id || '|' || bet_dok_id || '|' || punkt"

  - name: int_motion_outcome
    description: |
      One row per (motion, betänkande) pair.
      A motion can be treated in multiple betänkanden when it spans multiple policy areas.
      Resolves mot → bet → utskottsforslag via dlt join keys.
      
      Explicit bifall from int_motion_bifall (parsed from forslag text) takes precedence
      over inferred outcomes from vinnare field.
      
      Provides outcome_score (O) and votering_id for downstream margin calculation.
    columns:
      - name: mot_dok_id
        description: "Motion document ID"
        tests:
          - not_null
      - name: bet_dok_id
        description: "Parent betänkande dok_id"
        tests:
          - not_null
      - name: outcome_score
        description: "O component: bifall=1.0, delvis_bifall=0.7, avslag/acklamation=0.3"
      - name: outcome_label
        description: "Human-readable: bifall | avslag | unknown"
      - name: bifall_typ
        description: "Type of approval if bifall: direkt_bifall | reservation_bifall | utskott_bifall"
      - name: is_delvis_bifall
        description: "True if motion was partially approved"
      - name: is_tillkannagivande
        description: "True if decision includes a tillkännagivande"
      - name: organ
        description: "Committee organ from parent betänkande (e.g. FiU, KU, CU)"
      - name: votering_id
        description: "Roll-call vote ID; null when beslutstyp=acklamation"
    tests:
      - unique:
          column_name: "mot_dok_id || '|' || bet_dok_id"

  - name: int_motion_vote_margin
    description: |
      One row per votering_id with aggregated Ja/Nej counts and the M (margin) component.
      M = 1 − |Ja − Nej| / (Ja + Nej). Joins to int_motion_outcome on votering_id.
    columns:
      - name: votering_id
        description: "Roll-call vote ID (primary key, lowercased)"
        tests:
          - not_null
          - unique
      - name: vote_margin_score
        description: "M component: 1.0 = 50/50 split, 0.0 = unanimous"
      - name: ja_count
        description: "Total Ja votes"
      - name: nej_count
        description: "Total Nej votes"

  - name: int_motion_signatories
    description: |
      One row per motion with signatory counts and derived N + C components.
      Source: stg_dokumentstatus_intressent where parent is a motion.
    columns:
      - name: mot_dok_id
        description: "Motion document ID (primary key)"
        tests:
          - not_null
          - unique
      - name: signatory_score
        description: "N component: min(signatory_count / 50, 1.0)"
      - name: cross_party_score
        description: "C component: distinct signatory parties / 8"
      - name: signatory_count
        description: "Total co-signers (undertecknare + huvudman)"
      - name: distinct_parties
        description: "Number of distinct parties among signatories"

  - name: int_vote_party_aggregation
    description: |
      Aggregates individual votes to party-level positions per votering_id.
      Pure SQL transformation with no LLM involvement.
      
      Used by cognition module to determine party positions on specific votes.
      A party's position is determined by majority vote among its members.
    columns:
      - name: votering_id
        description: "Roll-call vote ID (lowercased)"
        tests:
          - not_null
      - name: parti
        description: "Party abbreviation (e.g., 'S', 'M', 'SD')"
        tests:
          - not_null
      - name: ja
        description: "Count of Ja (in favor) votes"
      - name: nej
        description: "Count of Nej (against) votes"
      - name: avstar
        description: "Count of Avstående (abstain) votes"
      - name: franvarande
        description: "Count of Frånvarande (absent) members"
      - name: total_members
        description: "Total party members in this vote"
      - name: party_position
        description: "Derived position: supported | opposed | abstained | split | absent"
      - name: position_confidence
        description: "How unified the party was (1.0 = unanimous)"
    tests:
      - unique:
          column_name: "votering_id || '|' || parti"

  - name: int_vote_source_links
    description: |
      Links each vote (votering_id) to its source documents (motions and propositions).
      Enables tracing from a vote back to substantive policy content.
      
      Join chain: utskottsforslag → bet → referens (behandlar) → mot/prop
      
      Note: A single vote may decide on multiple source documents.
      A single source document may be decided by multiple votes.
    columns:
      - name: votering_id
        description: "Roll-call vote ID (lowercased)"
        tests:
          - not_null
      - name: bet_dok_id
        description: "Betänkande document ID"
        tests:
          - not_null
      - name: rm
        description: "Riksmöte (e.g., '2024/25')"
      - name: organ
        description: "Committee organ (e.g., 'FiU', 'KU')"
      - name: punkt
        description: "Decision point number within betänkande"
      - name: punkt_rubrik
        description: "Decision point heading"
      - name: vinnare
        description: "Winner: 'utskottet' or 'motförslaget'"
      - name: beslutstyp
        description: "Decision type (e.g., 'votering', 'acklamation')"
      - name: source_dok_id
        description: "Source document ID (motion or proposition)"
        tests:
          - not_null
      - name: source_dok_typ
        description: "'mot' or 'prop'"
        tests:
          - not_null
      - name: source_titel
        description: "Source document title"
      - name: vote_outcome
        description: "Outcome for this source: approved | rejected | acklamation | unknown"

  - name: int_document_content
    description: |
      Pre-filtered, deduplicated table of motions and propositions with HTML content.
      Optimized for cognition's source embedding pipeline.
      
      Why this exists:
        - stg_dokumentstatus is a VIEW to avoid materializing ~10GB of HTML
        - Cognition needs HTML content but OOMs when deduplicating the full view
        - This table pre-filters to mot/prop only (~5% of documents) and materializes
          the result, so cognition reads a clean, smaller table
      
      Memory optimization:
        - Window function operates on minimal columns (dok_id, _dlt_id, _dlt_load_id)
        - Filter to mot/prop BEFORE deduplication reduces working set
        - Join back to get HTML only for winning rows
    columns:
      - name: dok_id
        description: "Document identifier (primary key)"
        tests:
          - not_null
          - unique
      - name: dok_typ
        description: "Document type: 'mot' (motion) or 'prop' (proposition)"
        tests:
          - not_null
          - accepted_values:
              values: ['mot', 'prop']
      - name: rm
        description: "Riksmöte (parliamentary session, e.g., '2024/25')"
      - name: riksmote_year
        description: "Pre-computed year from rm for efficient filtering (e.g., 2024)"
      - name: titel
        description: "Document title"
      - name: html
        description: "Full HTML content of the document"
        tests:
          - not_null
      - name: dokument_url
        description: "URL to the document on riksdagen.se"
      - name: _dlt_id
        description: "DLT record identifier - links to stg_dokumentstatus_intressent via _dlt_root_id"
        tests:
          - not_null
