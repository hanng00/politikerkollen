[project]
name = "ingestion"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "dlt[motherduck]>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
